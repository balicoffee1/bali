# docker-compose.yaml

services:
  db:
    image: postgres:13.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - island_bali/.env
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    depends_on:
      - db
    env_file:
      - island_bali/.env
    entrypoint: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             exec gunicorn island_bali.wsgi:application -b 0.0.0.0:8000"

  # M2: отдельный ASGI-процесс (daphne) только для /ws/* — HTTP API по-прежнему
  # обслуживается сервисом "web" (gunicorn/WSGI), см. nginx/default.conf.
  ws:
    build: .
    restart: always
    env_file:
      - island_bali/.env
    depends_on:
      - db
      - redis
      - web
    command: daphne -b 0.0.0.0 -p 8001 island_bali.asgi:application

  admin-panel:
    build:
      context: ../admin-panel
      dockerfile: Dockerfile
    restart: always
    volumes:
      - admin_panel_value:/usr/share/nginx/html

  nginx:
    image: nginx:1.21.3-alpine
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_value:/var/html/static/
      - media_value:/var/html/media/
      - ../admin-panel/dist:/var/html/admin-panel/
    depends_on:
      - web
      - ws
      - admin-panel

  redis:
    image: "redis:latest"
    restart: always
    ports:
      - "6380:6379"

  celery:
    build: .
    restart: always
    env_file:
      - island_bali/.env
    command: celery -A island_bali worker -l info
    depends_on:
      - web
      - db
      - redis

  celery-beat:
    build: .
    restart: always
    env_file:
      - island_bali/.env
    command: celery -A island_bali beat -l info
    depends_on:
      - web
      - db
      - redis

volumes:
  static_value:
  media_value:
  postgres_data:
  admin_panel_value:
