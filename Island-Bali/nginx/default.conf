# M2: WebSocket upgrade helper. Native (non-browser) clients that don't send Upgrade
# fall through to "close" so a plain HTTP request to /ws/ doesn't hang.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 8000;
    server_name localhost;

    client_max_body_size 50M;

    # Static files from Django
    location /static/ {
        alias /var/html/static/;
    }

    # Uploaded Media files
    location /media/ {
        alias /var/html/media/;
    }

    # Django API, native admin, swagger
    location ~ ^/(api|admin|swagger|redoc)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M2: WebSocket order notifications — separate ASGI (daphne) process, HTTP API
    # above is untouched. Long read/send timeout so idle sockets aren't killed by
    # nginx's default 60s; JWT travels in the Authorization header of the handshake,
    # so nothing sensitive ends up in the query string or access log here.
    location /ws/ {
        proxy_pass http://ws:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Web Admin Panel React SPA
    location / {
        root /var/html/admin-panel/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
